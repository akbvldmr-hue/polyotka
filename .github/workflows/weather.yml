name: Update Weather in Полётка

on:
  workflow_dispatch:
  schedule:
    # 07:00 Europe/Moscow = 04:00 UTC
    - cron: '0 4 * * *'

permissions:
  contents: write

jobs:
  update-weather:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update weather text
        run: python scripts/update_weather_poletka.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi

          git add "Полётка.html"
          git commit -m "chore: update daily weather"
          git push
